<!-- Drawn on the 108x108 adaptive canvas; the viewBox crops to the central 72dp a launcher shows.
     Same path data as app/src/main/res/drawable/ic_launcher_foreground.xml. -->
  <rect width="108" height="108" fill="#141A3C"/>
  <!-- Player: orange -->
  <path fill="#FF9A3C" d="M24.03,42.59a5.5,5.5 0,1 0,11,0a5.5,5.5 0,1 0,-11,0z"/>
  <!-- Player: yellow -->
  <path fill="#FFE84A" d="M58.66,28.16a4.75,4.75 0,1 0,9.5,0a4.75,4.75 0,1 0,-9.5,0z"/>
  <!-- Player: green -->
  <path fill="#3DF29A" d="M75.48,53.06a5.5,5.5 0,1 0,11,0a5.5,5.5 0,1 0,-11,0z"/>
  <!-- Player: cyan -->
  <path fill="#3DE9F2" d="M36.32,77.84a5,5 0,1 0,10,0a5,5 0,1 0,-10,0z"/>
  <!-- Halo ring around the winner, cut where the finger crosses it -->
  <path fill="#FFFFFF" d="M51.68,70.74A16.9,16.9 0,1 1 70.52,57.55L68.3,54.37A14.3,14.3 0,1 0 49.45,67.56z"/>
  <!-- Winner dot, cut around the fingertip -->
  <path fill="#FF3D8E" d="M46.55,63.4A12,12 0,1 1 65.39,50.21L65.14,49.86A11.5,11.5 0,0 0 49.12,47.04A11.5,11.5 0,0 0 46.3,63.05z"/>
  <!-- Finger, with a hole around the nail; runs off the canvas -->
  <path fill="#EEF0FA" d="M47.94,61.91L93.82,127.44L109.39,116.54L63.5,51.01A9.5,9.5 0,0 0 50.27,48.68A9.5,9.5 0,0 0 47.94,61.91zM49.45,59.01A6.6,6.6 0,0 1 60.27,51.44L63.31,55.78L52.49,63.36z"/>
  <!-- Nail plate -->
  <path fill="#C9D0EE" d="M50.44,58.33A5.4,5.4 0,0 1 59.28,52.13L61.64,55.49L52.79,61.68z"/>
